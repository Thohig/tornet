<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hiss-O-Matic 3000</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=31">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="logo" data-hint="<b>Hiss-O-Matic 3000:</b> en skyskrapa med åtta hissar. Luta dig tillbaka och titta – eller byt styrlogik, utlös incidenter och se hur huset klarar dygnet.">HISS-O-MATIC <span>3000</span></div>
    <div class="tb-clock">
      <div class="clock" id="clock" data-hint="<b>Dag eller natt:</b> ☀️ dag, 🌙 natt. Ett dygn tar sex minuter – dagen fyra, kvällen en halv och natten en och en halv.">☀️</div>
      <div class="tb-sub" data-hint="<b>Just nu:</b> dygnets fas (morgonrusning, lunch, hemgång …) och vädret – kyla gör att dörrarna i entrén tar emot. Under: dygnets nummer, hur många som är i huset och fröet som bestämmer dygnet (<code>?seed=</code>)."><div class="phase" id="phase">Morgonrusning</div><div class="day" id="day">Dag 1</div></div>
    </div>
    <div class="tb-group">
      <button id="btnPause" class="btn" data-hint="<b>Paus:</b> stoppar tiden. Allt står still tills du trycker igen. (Mellanslag)">❚❚</button>
      <div class="speeds" id="speeds" data-hint="<b>Fart:</b> hur fort tiden går. Samma dygn oavsett fart – bara snabbare. (1, 2)">
        <button data-s="1" class="btn on">1×</button>
        <button data-s="2" class="btn">2×</button>
      </div>
    </div>
    <div class="tb-group">
      <button id="btnTags" class="btn" data-hint="<b>Namnbrickor:</b> visar namnet över varje person i bilden. (T)">ID</button>
      <button id="btnAuto" class="btn" data-hint="<b>Regissör:</b> kameran letar själv upp det mest sevärda – bränder, ambulansen, tåget, stamgäster som säger något, sura köer – och klipper dit. Perfekt att ha igång i bakgrunden. Scrolla eller följ något själv så tar du över. (A)">🎬</button>
      <button id="btnSound" class="btn" data-hint="<b>Ljud:</b> motorbrum, pling, dörrar och överlastsummer från hissarna i bild. (M)">🔇</button>
    </div>
    <div class="tb-group cam" id="camBar" hidden></div>
    <div class="tb-group strat">
      <div class="strats" id="strats"></div>
      <div class="pop hint" id="stratHint"></div>
    </div>
    <button id="btnBus" class="btn hot" data-hint="<b>BUSS!</b> En turistbuss stannar utanför och släpper in en hel busslast besökare på en gång. Prova mitt i rusningen. Fungerar inte när huset är stängt eller det brinner.">BUSS!</button>
    <div class="tb-stats" id="tbStats" data-hint="<b>Dagens resultat:</b> betyg (A–F efter snittväntan), antal avklarade resor, hur många som väntar på hiss just nu och snittväntan i sekunder. Mer i 🏆."></div>
    <nav class="tabs" id="tabs">
      <button class="btn tab" data-act="tab:track" data-hint="<b>Spårad person:</b> allt om den du klickat på – vart hen ska, hur länge hen väntat och humöret.">👤</button>
      <button class="btn tab" data-act="tab:roster" data-hint="<b>Personregister:</b> alla i huset just nu, med filter. Klicka på ett namn för att följa personen.">📋</button>
      <button class="btn tab" data-act="tab:log" data-hint="<b>Beslutslogg:</b> vad styrsystemet bestämt (vilken hiss som fick vem och varför) och vad som hänt i huset.">📜</button>
      <button class="btn tab" data-act="tab:stats" data-hint="<b>Dagens resultat:</b> väntetider, betyg, energi, trappresor och säkerhet för dygnet så här långt.">🏆</button>
    </nav>
    <div class="tb-group menu">
      <button class="btn" data-act="menu" data-hint="<b>Meny:</b> utlös incidenter (brand, ström, hissfel, storm, het motor, linbrott), och ställ in felknappar och underhåll.">⋯</button>
      <div class="pop" id="menu">
        <div class="pop-h">Incidenter</div>
        <label class="auto"><input type="checkbox" id="autoInc" checked> slumpas fram under dagen</label>
        <div class="inc-trig">Utlös nu:
          <button class="btn xs" data-act="trig:fire">🔥 Brand</button>
          <button class="btn xs" data-act="trig:power">⚡ Ström</button>
          <button class="btn xs" data-act="trig:fault">🔧 Hissfel</button>
          <button class="btn xs" data-act="trig:storm">🌬️ Storm</button>
          <button class="btn xs" data-act="trig:heat">🌡️ Het motor</button>
          <button class="btn xs" data-act="trig:cable">🪢 Linbrott</button>
        </div>
        <div class="pop-h">Felknappar</div>
        <div class="chips" id="mistakeChips" title="Hur ofta folk trycker på fel knapp (och barn på alla)">
          <button data-f="av" class="chip">Av</button>
          <button data-f="lite" class="chip on">Lite</button>
          <button data-f="mycket" class="chip">Mycket</button>
        </div>
        <div class="pop-h">Underhåll</div>
        <div class="chips" id="maintChips" title="Nattservice håller nere slitaget – utan den slits hissarna dag för dag och går oftare sönder">
          <button data-f="natt" class="chip on">Nattservice</button>
          <button data-f="fel" class="chip">Bara vid fel</button>
        </div>
      </div>
    </div>
    <div class="pop hint" id="tbHint"></div>
  </header>

  <div id="main">
    <main id="stage">
      <canvas id="game"></canvas>
      <section class="float incidents" id="incPanel" hidden><div id="incBody"></div></section>
      <section class="float car" id="carPop" hidden></section>
    </main>

    <aside id="drawer" hidden>
      <section class="screen pane" data-pane="track">
        <div class="pane-t">SPÅRAD PERSON<button class="pane-x" data-act="tab:track" title="Stäng (Esc)">✕</button></div>
        <div class="track">
          <div id="trackEmpty" class="tk-empty">Klicka på en person i huset, i registret eller i loggen för att följa hen genom hisslogiken.</div>
          <div id="trackBody" hidden>
            <div class="tk-top">
              <canvas id="portrait"></canvas>
              <div class="tk-id">
                <div class="tk-name" id="tkName"></div>
                <div class="tk-role" id="tkRole"></div>
                <div class="tk-state" id="tkState"></div>
              </div>
              <button class="tk-x" id="tkClose" title="Sluta spåra">✕</button>
            </div>
            <div class="tk-line"><b>SYFTE</b><span id="tkWhy"></span></div>
            <div class="tk-line"><b>LÄGE</b><span id="tkNow"></span></div>
            <div class="tk-line"><b>LOGIK</b><span id="tkLogic"></span></div>
            <div class="tk-line"><b>IDAG</b><span id="tkDay"></span></div>
            <div class="tk-hist" id="tkHist"></div>
          </div>
        </div>
      </section>
      <section class="screen pane" data-pane="roster">
        <div class="pane-t">PERSONREGISTER <span id="sum-roster"></span><button class="pane-x" data-act="tab:roster" title="Stäng (Esc)">✕</button></div>
        <div class="chips" id="rosterChips">
          <button data-f="all" class="chip on">Alla</button>
          <button data-f="wait" class="chip">Väntar</button>
          <button data-f="ride" class="chip">Åker</button>
          <button data-f="in" class="chip">Inne</button>
        </div>
        <div class="roster" id="roster"></div>
      </section>
      <section class="screen pane" data-pane="log">
        <div class="pane-t">BESLUTSLOGG<button class="pane-x" data-act="tab:log" title="Stäng (Esc)">✕</button></div>
        <div class="chips" id="logChips">
          <button data-f="all" class="chip on">Allt</button>
          <button data-f="lift" class="chip">Hissar</button>
          <button data-f="person" class="chip">Personer</button>
          <button data-f="button" class="chip">Knappar</button>
          <button data-f="sel" class="chip">Spårad</button>
        </div>
        <div id="log" class="log"></div>
      </section>
      <section class="panel pane statspane" data-pane="stats">
        <div class="label">DAGENS RESULTAT<button class="pane-x" data-act="tab:stats" title="Stäng (Esc)">✕</button></div>
        <div class="stats" id="stats"></div>
      </section>
    </aside>
  </div>
</div>

<div id="overlay" class="overlay"></div>

<script type="module" src="src/main.js"></script>
</body>
</html>
