# Typkontroll och hela testsviten (npm run check) vid varje push, på alla grenar.
# Repot är publikt, så Actions-minuterna är obegränsade. Ingen körning för pull_request: en pull request
# visar körningen från pushen till sin gren (samma commit), så den testas inte två gånger.
# Ändringar som bara rör .md-filer startar ingen körning.
# Fångar brutet facit (tests/golden.json), typfel och brutna invarianter innan de hamnar på main.
name: Kontroll

on:
  push:
    paths-ignore: ['**.md']
  workflow_dispatch:

# En ny push på samma gren avbryter körningen som redan pågår.
concurrency:
  group: kontroll-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typkontroll och tester
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typkontroll
        run: npm run typecheck
      - name: Tester
        run: npm test
